$kind: http-request
description: "Нельзя понизить последнего активного админа (409 LAST_ADMIN_REQUIRED)."
url: "{{baseUrl}}/api/v1/admin/users/{{userId}}/role"
method: PATCH
body:
  type: json
  content: |-
    {
        "role": "manager"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
order: 6000
