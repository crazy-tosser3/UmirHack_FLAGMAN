spring.application.name=UmirHack_Flagman

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/UmirFlagman}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:123456}


spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.auth.jwt-issuer=${JWT_ISSUER:umirhack-flagman}
app.auth.jwt-audience=${JWT_AUDIENCE:restaurant-management-api}
app.auth.jwt-signing-key=${JWT_SIGNING_KEY:dev-only-signing-key-change-me-in-production-0123456789}
app.auth.access-ttl=${JWT_ACCESS_TTL:15m}
app.auth.refresh-ttl=${REFRESH_TOKEN_TTL:30d}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}

# Склад
app.inventory.expiry-warning-hours=${EXPIRY_WARNING_HOURS:24}
app.inventory.auto-write-off=${AUTO_WRITE_OFF:true}
app.inventory.offers-horizon-hours=72
app.inventory.offers-default-limit=10
app.inventory.expiry-check-interval-ms=60000

app.seed.enabled=${SEED_ENABLED:true}
app.simulator.enabled=${SIMULATOR_ENABLED:false}
app.simulator.interval-ms=5000

app.admin.email=${ADMIN_EMAIL:admin@yandex.ru}
app.admin.password=${ADMIN_PASSWORD:adminadmin1234}
app.admin.name=${ADMIN_NAME:Администратор}

# Ссылка-приглашение
app.invite.base-url=${INVITE_BASE_URL:http://localhost:5173/register?code={code}}
app.invite.ttl=${INVITE_TTL:48h}

app.analytics.zone=${APP_TIMEZONE:Europe/Moscow}

app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:8302221199:AAEl-B5RZROi5Wuu3fY41kwgq08fmF1-GM0}
app.telegram.bot-username=${TELEGRAM_BOT_USERNAME:@JarvisssssssssssssBot}
app.telegram.polling-enabled=${TELEGRAM_POLLING:true}
app.telegram.auth-max-age=${TELEGRAM_AUTH_MAX_AGE:1h}
