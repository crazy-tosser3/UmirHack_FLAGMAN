spring.application.name=UmirHack_Flagman

spring.datasource.url=jdbc:postgresql://localhost:5432/UmirFlagman
spring.datasource.username=admin
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Авторизация. Значения по умолчанию только для локальной разработки
app.auth.jwt-issuer=${JWT_ISSUER:umirhack-flagman}
app.auth.jwt-audience=${JWT_AUDIENCE:restaurant-management-api}
app.auth.jwt-signing-key=${JWT_SIGNING_KEY:dev-only-signing-key-change-me-in-production-0123456789}
app.auth.access-ttl=${JWT_ACCESS_TTL:15m}
app.auth.refresh-ttl=${REFRESH_TOKEN_TTL:30d}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
